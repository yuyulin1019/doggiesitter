<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>保母時間</title>
  <style>
    :root{--ink:#1d1d1f;--muted:#86868b;--line:#e5e5e7;--paper:#fff;--bg:#f5f5f7;--blue:#007aff;--red:#ff3b30}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}button,input,select{font:inherit;color:inherit}button{cursor:pointer}
    .app{max-width:1260px;margin:0 auto;padding:20px 28px 30px}.toolbar{height:48px;display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.month-tools{display:flex;align-items:center;gap:8px}.nav{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#666;font-size:23px;line-height:1}.nav:hover,.manage:hover{background:#e9e9eb}.month-title{font-size:20px;font-weight:650;letter-spacing:-.35px;min-width:130px;text-align:center;margin:0}.today{height:31px;padding:0 11px;border:1px solid #dedee1;border-radius:8px;background:#fff;font-size:12px;font-weight:600;color:var(--blue);margin-left:7px}.who{display:flex;align-items:center;gap:8px}.who select{border:0;border-radius:9px;background:#fff;padding:9px 30px 9px 12px;min-width:112px;font-size:13px;font-weight:600;box-shadow:0 0 0 1px #e5e5e7}.manage{height:34px;padding:0 9px;border:0;border-radius:8px;background:transparent;color:var(--blue);font-size:13px;font-weight:550}
    .calendar{background:var(--paper);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px #0000000a,0 0 0 1px #e5e5e7}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{height:37px;border-bottom:1px solid var(--line);align-items:center}.weekdays span{text-align:center;color:#77777d;font-size:11px;font-weight:600}.weekdays span:first-child{color:#d04a43}.day{min-width:0;min-height:120px;padding:7px 7px 5px;border:0;border-right:1px solid #e9e9eb;border-bottom:1px solid #e9e9eb;background:#fff;text-align:left;vertical-align:top}.day:nth-child(7n){border-right:0}.day:hover{background:#fafafd}.day.outside{background:#fbfbfc}.date-line{height:23px;display:flex;justify-content:center;align-items:center;margin-bottom:4px}.date{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:500;color:#303035}.outside .date{color:#b9b9bf}.today-date .date{background:var(--red);color:white;font-weight:600}.events{display:flex;flex-direction:column;gap:3px}.event{display:flex;align-items:center;gap:5px;height:20px;min-width:0;padding:0 5px;border-radius:5px;font-size:10px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event-dot{width:6px;height:6px;flex:none;border-radius:50%}.event-name{overflow:hidden;text-overflow:ellipsis}.overflow{padding:0 5px;color:#66666b;font-size:10px;line-height:18px}.no-event{height:18px;color:#d5d5d9;font-size:10px;padding:2px 3px}.day.active{box-shadow:inset 0 0 0 2px #8bb6f0;background:#f7fbff}.footer{display:flex;justify-content:space-between;align-items:center;color:#85858a;font-size:11px;padding:9px 2px 0}.footer span:first-child{color:#66666c}.mode-switch{display:flex;gap:2px;background:#e9e9eb;border-radius:9px;padding:3px}.mode-switch button{border:0;border-radius:7px;background:transparent;color:#69696e;padding:7px 10px;font-size:12px;font-weight:550}.mode-switch button.active{background:#fff;color:#1d1d1f;box-shadow:0 1px 3px #0002}.who[hidden]{display:none}.day-detail{display:flex;align-items:center;gap:13px;background:#fff;border-radius:11px;box-shadow:0 0 0 1px #e5e5e7;padding:12px 15px;margin-top:10px;min-height:58px}.detail-date{font-size:13px;font-weight:650;white-space:nowrap}.detail-names{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.detail-person{display:inline-flex;align-items:center;gap:5px;border-radius:20px;background:#f4f4f6;padding:5px 9px;font-size:11px;font-weight:600}.detail-person i{width:7px;height:7px;border-radius:50%}.detail-empty{font-size:12px;color:#89898f}.detail-count{margin-left:auto;color:#77777d;font-size:11px;white-space:nowrap}
    dialog{border:0;border-radius:15px;padding:0;width:min(410px,calc(100vw - 28px));box-shadow:0 24px 80px #0003;color:var(--ink)}dialog::backdrop{background:#0005;backdrop-filter:blur(2px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--line)}.dialog-head h2{font-size:17px;margin:0;font-weight:650}.close{border:0;background:none;color:var(--blue);font-size:14px;padding:4px}.sitter-list{padding:6px 20px 4px}.sitter-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eeeef0}.color-swatch{width:11px;height:11px;border-radius:50%;flex:none}.sitter-row input{min-width:0;flex:1;border:0;border-bottom:1px solid transparent;padding:6px 2px;font-size:14px;background:transparent;outline:0}.sitter-row input:focus{border-bottom-color:var(--blue)}.remove{border:0;background:none;color:var(--red);font-size:12px;padding:6px}.add-sitter{margin:12px 20px 3px;border:0;background:none;color:var(--blue);font-size:13px;padding:7px 0}.dialog-foot{display:flex;justify-content:flex-end;padding:12px 20px 18px}.save{border:0;border-radius:8px;background:var(--blue);color:white;font-weight:600;padding:8px 17px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,10px);background:#303034;color:white;border-radius:25px;padding:10px 16px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:720px){.app{padding:13px 9px 20px}.toolbar{height:auto;min-height:43px;margin-bottom:10px;gap:8px;flex-wrap:wrap}.month-tools{gap:2px}.month-title{font-size:17px;min-width:115px}.nav{width:30px;height:30px}.today{margin-left:3px;padding:0 8px}.who{gap:4px;margin-left:auto}.who select{min-width:88px;padding:8px 23px 8px 9px;font-size:12px}.manage{width:30px}.day{min-height:91px;padding:5px 3px}.date-line{height:22px;margin-bottom:3px}.event{height:17px;gap:3px;padding:0 3px;font-size:9px}.event-dot{width:5px;height:5px}.events{gap:2px}.overflow{font-size:9px;padding:0 2px}.no-event{height:14px}.weekdays{height:32px}.footer{font-size:10px}.mode-switch button{padding:7px 8px;font-size:11px}.day-detail{gap:8px;padding:10px}.detail-count{font-size:10px}}
    @media(max-width:430px){.app{padding:10px 5px 16px}.month-title{font-size:15px;min-width:97px}.today{font-size:11px;padding:0 7px}.who select{min-width:76px;font-size:11px}.day{min-height:76px;padding:4px 2px}.date{font-size:11px;width:20px;height:20px}.event{height:16px;font-size:8px;padding:0 2px}.event-dot{width:4px;height:4px}.footer{gap:8px;font-size:9px}.mode-switch button{padding:6px 6px;font-size:10px}.detail-date{font-size:11px}.detail-person{padding:4px 7px;font-size:10px}.day-detail{flex-wrap:wrap}.detail-count{margin-left:0}}
    [hidden]{display:none!important}.account{display:flex;align-items:center;gap:10px}.account-name{font-size:12px;font-weight:600}.account button{border:0;border-radius:8px;background:transparent;color:var(--blue);font-size:12px;padding:7px}.auth-screen,.pending-screen{max-width:380px;margin:10vh auto 0;background:#fff;border-radius:16px;padding:26px;box-shadow:0 1px 2px #0001,0 0 0 1px #e5e5e7}.auth-screen h2,.pending-screen h2{font-size:18px;margin:0 0 8px}.auth-screen p,.pending-screen p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 17px}.auth-form{display:flex;gap:8px}.auth-form input,.name-form input{min-width:0;flex:1;border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:13px}.primary{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:0 14px;font-size:12px;font-weight:600}.form-status{min-height:18px;margin-top:11px;color:#697b67;font-size:12px}.pending-screen button{border:0;background:var(--blue);color:#fff;border-radius:8px;padding:8px 13px;font-size:12px}.name-form{padding:20px;display:flex;gap:8px}.name-form .primary{min-height:38px}
  </style>
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="month-tools"><button class="nav" id="prev" aria-label="上個月">‹</button><h1 class="month-title" id="month"></h1><button class="nav" id="next" aria-label="下個月">›</button><button class="today" id="jump">今天</button></div>
      <div class="account" id="account" hidden><span class="account-name" id="memberName"></span><button id="rename" hidden>改名字</button><button id="logout">登出</button></div>
    </header>
    <section class="auth-screen" id="authScreen">
      <h2>登入查看排班</h2><p>輸入已加入名單的 Email，我們會寄送登入連結。</p>
      <form class="auth-form" id="loginForm"><input type="email" id="email" required placeholder="Email" autocomplete="email"><button class="primary" type="submit">寄登入連結</button></form>
      <div class="form-status" id="authStatus" role="status"></div>
    </section>
    <section class="pending-screen" id="pendingScreen" hidden><h2>這個帳號尚未加入名單</h2><p>請聯絡排班管理者加入你的 Email，再重新登入。</p><button id="retryAccess">重新確認</button></section>
    <section id="calendarApp" hidden>
      <div class="toolbar">
        <div class="mode-switch" role="group" aria-label="使用模式"><button class="active" data-mode="view">查看空檔</button><button id="editMode" data-mode="edit" hidden>保母登記</button></div>
      </div>
      <section class="calendar" aria-label="保母可服務日期月曆"><div class="weekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="grid" id="grid"></div></section>
      <section class="day-detail" id="dayDetail" aria-live="polite"></section>
      <footer class="footer"><span id="hint">點選日期查看當天有哪些保母有空</span><span id="legend"></span></footer>
    </section>
  </main>
  <dialog id="nameDialog"><form class="name-form" id="nameForm"><input id="nameInput" required maxlength="30" placeholder="顯示名稱"><button class="primary" type="submit">儲存</button></form></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="./supabase-config.js"></script>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.95.0';
    const config=window.SUPABASE_CONFIG;
    const supabase=createClient(config.url,config.publishableKey);
    const $=selector=>document.querySelector(selector),pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const palette=[['#d9825c','#fbeee8'],['#608d69','#eaf3eb'],['#6687ad','#eaf0f8'],['#a77a9f','#f5edf4'],['#c3903d','#fbf3e3'],['#4e9c9a','#e6f4f2'],['#8781b2','#eeedf8'],['#c66f77','#f9e9eb']];
    let cursor=new Date(2026,10,1),selected='2026-11-01',mode='view',session=null,member=null,members=[],availability={},channel=null;
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function paintStatus(message){$('#authStatus').textContent=message}
    function openToast(message){const toast=$('#toast');toast.textContent=message;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}
    async function sendLogin(event){event.preventDefault();const email=$('#email').value.trim();if(!email)return;paintStatus('正在寄送…');const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});paintStatus(error?`寄送失敗：${error.message}`:'登入連結已寄出，請查看信箱。')}
    async function handleSession(nextSession){session=nextSession;member=null;$('#calendarApp').hidden=true;$('#pendingScreen').hidden=true;$('#account').hidden=!session;$('#authScreen').hidden=!!session;if(channel){await supabase.removeChannel(channel);channel=null}if(!session){mode='view';return}const {data,error}=await supabase.from('members').select('id,display_name,role').eq('id',session.user.id).maybeSingle();if(error){$('#pendingScreen').hidden=false;$('#pendingScreen p').textContent=`讀取帳號權限失敗：${error.message}`;return}if(!data){$('#pendingScreen').hidden=false;return}member=data;$('#memberName').textContent=data.display_name;$('#rename').hidden=false;$('#editMode').hidden=data.role!=='sitter';if(data.role!=='sitter')mode='view';$('#calendarApp').hidden=false;await loadCalendar();channel=supabase.channel('availability-live').on('postgres_changes',{event:'*',schema:'public',table:'availability'},()=>loadCalendar()).on('postgres_changes',{event:'*',schema:'public',table:'members'},()=>loadCalendar()).subscribe()}
    async function loadCalendar(){if(!member)return;const [memberResult,availabilityResult]=await Promise.all([supabase.from('members').select('id,display_name,role').order('created_at'),supabase.from('availability').select('caregiver_id,available_on')]);if(memberResult.error||availabilityResult.error){openToast(memberResult.error?.message||availabilityResult.error?.message||'讀取排班失敗');return}members=(memberResult.data||[]).map((p,i)=>({...p,...palette[i%palette.length]}));availability={};for(const row of availabilityResult.data||[])(availability[row.available_on]??=[]).push(row.caregiver_id);render()}
    function render(){if(!member)return;$('#month').textContent=`${cursor.getFullYear()} 年 ${cursor.getMonth()+1} 月`;$('#editMode').classList.toggle('active',mode==='edit');document.querySelector('[data-mode="view"]').classList.toggle('active',mode==='view');$('#hint').textContent=mode==='view'?'點選日期查看當天有哪些保母有空':'點日期登記／取消你的有空時間';$('#legend').innerHTML=members.filter(p=>p.role==='sitter').map(p=>`<span style="color:${p.color}">●</span> ${esc(p.display_name)}`).join('　');const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1),total=new Date(y,m+1,0).getDate(),rows=Math.ceil((first.getDay()+total)/7),start=new Date(y,m,1-first.getDay()),grid=$('#grid');grid.innerHTML='';for(let i=0;i<rows*7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const dayKey=key(d),list=(availability[dayKey]||[]).map(id=>members.find(p=>p.id===id)).filter(p=>p&&p.role==='sitter'),cell=document.createElement('button');cell.className=`day ${d.getMonth()===m?'':'outside'} ${dayKey===selected?'active':''} ${dayKey===key(new Date())?'today-date':''}`;cell.setAttribute('aria-label',`${d.getMonth()+1}月${d.getDate()}日，${list.length?list.map(p=>p.display_name).join('、')+'有空':'無人登記'}`);let events=list.slice(0,4).map(p=>`<span class="event" style="background:${p.tint};color:${p.color}" title="${esc(p.display_name)}"><i class="event-dot" style="background:${p.color}"></i><span class="event-name">${esc(p.display_name)}</span></span>`).join('');if(list.length>4)events+=`<span class="overflow">+${list.length-4} 位</span>`;if(!list.length)events='<span class="no-event">&nbsp;</span>';cell.innerHTML=`<span class="date-line"><span class="date">${d.getDate()}</span></span><span class="events">${events}</span>`;cell.onclick=()=>mode==='edit'?toggle(dayKey):selectDay(dayKey);grid.append(cell)}renderDayDetail()}
    function selectDay(dayKey){selected=dayKey;render()}
    function renderDayDetail(){if(!selected)return;const [y,m,d]=selected.split('-').map(Number),date=new Date(y,m-1,d),list=(availability[selected]||[]).map(id=>members.find(p=>p.id===id)).filter(p=>p&&p.role==='sitter');$('#dayDetail').innerHTML=`<span class="detail-date">${m} 月 ${d} 日（${['日','一','二','三','四','五','六'][date.getDay()]}）</span><span class="detail-names">${list.length?list.map(p=>`<span class="detail-person"><i style="background:${p.color}"></i>${esc(p.display_name)}</span>`).join(''):'<span class="detail-empty">目前沒有人登記有空</span>'}</span><span class="detail-count">${list.length} 位有空</span>`}
    async function toggle(dayKey){if(member?.role!=='sitter')return;selected=dayKey;const found=(availability[dayKey]||[]).includes(member.id);const result=found?await supabase.from('availability').delete().eq('caregiver_id',member.id).eq('available_on',dayKey):await supabase.from('availability').insert({caregiver_id:member.id,available_on:dayKey});if(result.error){openToast(`更新失敗：${result.error.message}`);return}await loadCalendar();openToast(found?'已取消這天的空檔':'已登記這天有空')}
    async function changeName(event){event.preventDefault();const name=$('#nameInput').value.trim();if(!name||!member)return;const {error}=await supabase.from('members').update({display_name:name}).eq('id',member.id);if(error){openToast(`更新失敗：${error.message}`);return}member.display_name=name;$('#memberName').textContent=name;$('#nameDialog').close();await loadCalendar()}
    $('#loginForm').addEventListener('submit',sendLogin);$('#retryAccess').onclick=()=>handleSession(session);$('#prev').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()-1,1);selected=key(cursor);render()};$('#next').onclick=()=>{cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);selected=key(cursor);render()};$('#jump').onclick=()=>{cursor=new Date();selected=key(cursor);render()};document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{if(button.dataset.mode==='edit'&&member?.role!=='sitter')return;mode=button.dataset.mode;render()});$('#rename').onclick=()=>{$('#nameInput').value=member?.display_name||'';$('#nameDialog').showModal()};$('#nameForm').addEventListener('submit',changeName);$('#logout').onclick=()=>supabase.auth.signOut();supabase.auth.onAuthStateChange((_event,nextSession)=>setTimeout(()=>handleSession(nextSession),0));const {data:{session:existingSession}}=await supabase.auth.getSession();await handleSession(existingSession);
  </script>
</body>
</html>
